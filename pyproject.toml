[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-rank-bench"
version = "0.1.0"
description = "Reproducible GPU retrieval, filtering, and recommendation ranking studies"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "torch>=2.7"]

[project.optional-dependencies]
gpu = [
    "torch==2.13.0",
    "faiss-gpu-cu12==1.14.1.post1; sys_platform == 'linux'",
    "torchrec==1.8.0",
    "fbgemm-gpu==1.8.0",
    "ninja==1.13.0",
]
cpu = ["faiss-cpu==1.14.2"]
test = ["pytest>=8.3,<10"]

[project.scripts]
rrbench = "rrbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
