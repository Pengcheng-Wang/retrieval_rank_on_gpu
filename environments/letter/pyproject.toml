[project]
name = "letter-author-code-env"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "setuptools==68.2.2",
    "wheel==0.41.2",
    "torch==1.13.1+cu117; sys_platform == 'linux'",
    "numpy==1.24.4",
    "scipy==1.10.1",
    "scikit-learn==1.2.2",
    "k-means-constrained==0.7.3",
    "ortools==9.6.2534",
    "transformers==4.31.0",
    "tokenizers==0.13.3",
    "accelerate==0.21.0",
    "peft==0.4.0",
    "bitsandbytes==0.41.1; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu11==11.7.99; sys_platform == 'linux'",
    "nvidia-cusparse-cu11==11.7.4.91; sys_platform == 'linux'",
    "sentencepiece==0.1.99",
    "huggingface-hub==0.16.4",
    "safetensors==0.3.3",
    "evaluate==0.4.0",
    "datasets==2.14.6",
    "pyarrow==14.0.2",
    "fsspec==2023.10.0",
    "wandb==0.15.12",
    "pydantic==1.10.13",
    "tqdm==4.66.1",
    "pytest==8.3.5",
]

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu117" }

[tool.uv]
environments = ["sys_platform == 'linux'"]
